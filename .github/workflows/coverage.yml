name: Régénérer la couverture

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coverage
  cancel-in-progress: true

jobs:
  couverture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Régénérer COUVERTURE.md
        run: python3 scripts/couverture.py
      - name: Commettre si modifié
        run: |
          if ! git diff --quiet -- COUVERTURE.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add COUVERTURE.md
            git commit -m "Régénère COUVERTURE.md [skip ci]"
            git push
          else
            echo "COUVERTURE.md déjà à jour."
          fi
